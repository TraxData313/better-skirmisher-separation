<!DOCTYPE html>
<!-- Steam Workshop / mod thumbnail v3, 1024x1024: v1 (BEFORE | AFTER, big title) plus the Throwing Weapons filter
     icon from the Order of Battle card (as on v2), ringed in gold on a dark disc, top centre on the split line:
     "with the Throwing filter on: before -> after". Rendered by: python tools\make_thumbnail.py --variant v3 -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; background: #0d0a07; }
  .canvas {
    position: relative;
    width: 1024px; height: 1024px;
    background: #0d0a07;
    font-family: 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  }
  .panel {
    position: absolute; top: 0; width: 512px; height: 700px;
    background-size: cover; background-position: center top;
    filter: brightness(1.02) contrast(1.06) saturate(1.1);
  }
  .panel.before { left: 0; background-image: url('PANEL_BEFORE'); }
  .panel.after  { left: 512px; background-image: url('PANEL_AFTER'); }
  .split {
    position: absolute; top: 0; left: 509px; width: 6px; height: 700px;
    background: linear-gradient(to bottom, rgba(214,178,94,0.95) 0%, rgba(214,178,94,0.95) 70%, rgba(214,178,94,0) 92%);
    box-shadow: 0 0 10px rgba(0,0,0,0.7);
  }
  .shade {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 130% 95% at 50% 28%, rgba(0,0,0,0) 45%, rgba(13,10,7,0.45) 82%, rgba(13,10,7,0.85) 100%),
      linear-gradient(to bottom, rgba(13,10,7,0.35) 0%, rgba(0,0,0,0) 14%, rgba(0,0,0,0) 50%, rgba(13,10,7,0.8) 62%, rgba(13,10,7,1) 69%);
  }
  .frame {
    position: absolute; inset: 22px;
    border: 3px solid rgba(214, 178, 94, 0.85);
    border-radius: 26px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 60px rgba(0,0,0,0.35);
  }
  .tag {
    position: absolute; top: 54px;
    background: rgba(16, 12, 8, 0.86);
    border: 2px solid rgba(214, 178, 94, 0.8);
    border-radius: 14px;
    padding: 8px 22px 12px;
    font-size: 44px; font-weight: 600;
    font-variant: small-caps; letter-spacing: 3px;
    line-height: 1;
    text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    box-shadow: 0 6px 20px rgba(0,0,0,0.55);
  }
  .tag.before { left: 54px; color: #ff6a5a; }
  .tag.after  { right: 54px; color: #6fe07c; }
  .badge {              /* the Throwing filter icon on the card's own dark brown, centred on the split */
    position: absolute; left: 437px; top: 28px; width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.35) 100%), url('ICON_IMG') center / ICON_SIZEpx ICON_SIZEpx no-repeat, #2d1805;
    border: 6px solid #ffd76a;
    box-shadow: 0 0 22px 7px rgba(255, 205, 90, 0.75), inset 0 0 16px rgba(255, 205, 90, 0.45), 0 10px 26px rgba(0,0,0,0.8);
  }
  .titleblock {
    position: absolute; left: 0; right: 0; bottom: 58px;
    text-align: center;
  }
  .ornament {
    color: #d6b25e; font-size: 26px; letter-spacing: 14px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    margin-bottom: 6px;
  }
  h1 {
    color: #e8c874;
    font-size: 92px;
    font-weight: 600;
    letter-spacing: 4px;
    font-variant: small-caps;
    line-height: 0.98;
    text-shadow: 0 3px 10px rgba(0,0,0,0.95), 0 0 45px rgba(232, 200, 116, 0.28);
  }
  .tagline {
    margin-top: 18px;
    color: #f0e4c8;
    font-size: 40px;
    font-style: italic;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.95);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="panel before"></div>
    <div class="panel after"></div>
    <div class="split"></div>
    <div class="shade"></div>
    <div class="badge"></div>
    <div class="tag before">Before</div>
    <div class="tag after">After</div>
    <div class="frame"></div>
    <div class="titleblock">
      <div class="ornament">✦ ✦ ✦</div>
      <h1>Better Skirmisher<br>Separation</h1>
      <div class="tagline">Legionaries are not skirmishers anymore.</div>
    </div>
  </div>
</body>
</html>
